<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#131722">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KODA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root { --bg:#131722; --card:#1E222D; --card2:#2A2E39; --line:rgba(255,255,255,.08); --txt:#F2F5F7; --mut:#8A98A5; --cy:#66A5AD; --gold:#C1A35F;  }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; background: var(--bg); color: var(--txt); font-family: 'Maven Pro', system-ui, sans-serif; }
        body { min-height: 100dvh; padding-bottom: calc(84px + env(safe-area-inset-bottom)); overscroll-behavior-y: contain; }
        button, input, select, textarea { font-family: inherit; color: inherit; color-scheme: dark; }
        button { cursor: pointer; border: 0; background: none; }
        .ms { font-family: 'Material Symbols Outlined'; font-size: 22px; line-height: 1; font-variation-settings: 'FILL' 0, 'wght' 400; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
        header { position: sticky; top: 0; z-index: 20; background: rgba(19,23,34,.9); backdrop-filter: blur(14px); padding: calc(14px + env(safe-area-inset-top)) 0 12px; }
        header .wrap { display: flex; align-items: center; justify-content: space-between; }
        .logo { font-weight: 900; font-size: 26px; letter-spacing: -.02em; } .logo i { color: var(--cy); font-style: normal; }
        .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--mut); }
        .icon-btn:active { background: var(--card); }
        .hero { background: radial-gradient(70% 90% at 20% 100%, rgba(102,165,173,.55), rgba(102,165,173,0) 70%), linear-gradient(160deg, #1A242C, #0C1217); border: 1px solid var(--line); border-radius: 24px; padding: 22px 20px; margin-top: 8px; }
        .lbl { color: var(--mut); font-size: 13px; font-weight: 500; }
        .big { font-size: 38px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
        .row2 { display: flex; gap: 10px; margin-top: 16px; }
        .chip { flex: 1; background: rgba(0,0,0,.28); border-radius: 14px; padding: 10px 12px; }
        .chip b { display: block; font-size: 16px; margin-top: 2px; }
        h2 { font-size: 15px; font-weight: 700; margin: 24px 2px 10px; color: var(--txt); }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
        .item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; }
        .item + .item { border-top: 1px solid var(--line); }
        .item .main { flex: 1; min-width: 0; }
        .item .t { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item .s { color: var(--mut); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .amt { font-weight: 700; font-size: 15px; white-space: nowrap; } .neg { color: var(--txt); } .pos { color: var(--cy); }
        .dot { width: 38px; height: 38px; border-radius: 12px; background: var(--card2); display: grid; place-items: center; color: var(--cy); flex: none; }
        .bar { height: 6px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 8px; } .bar > div { height: 100%; background: var(--cy); border-radius: 99px; }
        .empty { color: var(--mut); font-size: 14px; text-align: center; padding: 26px 16px; }
        .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(24,28,40,.95); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
        .tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 64px 1fr 1fr; align-items: center; }
        .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--mut); font-size: 11.5px; font-weight: 600; padding: 6px 0; }
        .tab.on { color: var(--cy); } .tab.on .ms { font-variation-settings: 'FILL' 1, 'wght' 500; }
        .fab { width: 54px; height: 54px; border-radius: 18px; background: var(--cy); color: #0F151B; display: grid; place-items: center; margin: -22px auto 0; box-shadow: 0 8px 24px rgba(102,165,173,.35); }
        .fab .ms { font-size: 28px; }
        .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .2s; }
        .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: #1A1F2B; border-radius: 26px 26px 0 0; border-top: 1px solid var(--line); padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .26s cubic-bezier(.2,.8,.2,1); max-height: 92dvh; overflow: auto; }
        body.sheet-on .sheet-bg { opacity: 1; pointer-events: auto; } body.sheet-on .sheet { transform: none; }
        .grab { width: 40px; height: 4px; border-radius: 9px; background: rgba(255,255,255,.18); margin: 0 auto 14px; }
        .field { display: block; margin-top: 12px; } .field > span { display: block; font-size: 12.5px; color: var(--mut); font-weight: 600; margin: 0 2px 6px; }
        .inp { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; font-size: 16px; outline: none; }
        .inp:focus { border-color: var(--cy); }
        input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; } input[type=number] { -moz-appearance: textfield; }
        .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-radius: 14px; padding: 4px; gap: 4px; }
        .seg button { padding: 10px; border-radius: 11px; font-weight: 700; font-size: 14px; color: var(--mut); } .seg button.on { background: var(--cy); color: #0F151B; }
        .btn { width: 100%; padding: 15px; border-radius: 16px; background: var(--cy); color: #0F151B; font-weight: 800; font-size: 16px; margin-top: 18px; }
        .btn:disabled { opacity: .55; }
        .err { color: var(--gold); font-size: 13px; margin-top: 10px; min-height: 0; }
        .view { display: none; } .view.on { display: block; animation: fade .25s ease-out; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        /* Chat */
        .msgs { display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
        .b { max-width: 86%; padding: 11px 14px; border-radius: 18px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
        .b.u { align-self: flex-end; background: var(--cy); color: #0F151B; border-bottom-right-radius: 6px; font-weight: 500; }
        .b.m { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
        .b.e { color: var(--gold); }
        .sug { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; color: var(--txt); }
        .chatbar { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom)); z-index: 25; background: var(--bg); padding: 8px 0 10px; border-top: 1px solid var(--line); display: none; }
        body.chat-on .chatbar { display: block; } body.chat-on { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
        .chatbar .wrap { display: flex; gap: 8px; align-items: flex-end; }
        .chatbar textarea { flex: 1; resize: none; max-height: 110px; }
        .send { width: 46px; height: 46px; border-radius: 14px; background: var(--cy); color: #0F151B; display: grid; place-items: center; flex: none; }
        .dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--mut); animation: bl 1.1s infinite; } .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
        @keyframes bl { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
        #toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: #2A2E39; border: 1px solid var(--line); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 60; }
        #toast.on { opacity: 1; transform: translate(-50%, 0); }
        .queue { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; color: var(--mut); align-items: center; gap: 10px; }
        .queue.on { display: flex; } .queue b { color: var(--gold); } .queue button { margin-left: auto; color: var(--cy); font-weight: 700; font-size: 13.5px; padding: 4px 2px; }
        .tag { color: var(--gold); font-weight: 700; }
        .pull { text-align: center; color: var(--mut); font-size: 12px; margin-top: 18px; }
    </style>
</head>
<body>
    <header><div class="wrap">
        <div class="logo">KODA<i>.</i></div>
        <div style="display:flex;gap:4px">
            <button class="icon-btn" onclick="cargar(true)" aria-label="Refresh"><span class="ms" id="ic-ref">refresh</span></button>
            <button class="icon-btn" onclick="salir()" aria-label="Sign out"><span class="ms">logout</span></button>
        </div>
    </div></header>

    <main class="wrap">
        <!-- Inicio -->
        <section class="view on" id="v-home">
            <div class="hero">
                <div class="lbl">Available balance</div>
                <div class="big" id="h-total">$0</div>
                <div class="lbl" id="h-detalle" style="margin-top:6px;font-size:12px"></div>
                <div class="row2">
                    <div class="chip"><span class="lbl">Spent this month</span><b id="h-gasto">$0</b></div>
                    <div class="chip"><span class="lbl">Income this month</span><b id="h-ingreso">$0</b></div>
                </div>
            </div>
            <div class="queue" id="h-cola"><span class="ms" style="color:var(--gold)">schedule</span><span id="h-cola-txt"></span><button onclick="enviarCola(true)">Send now</button></div>
            <h2>Accounts</h2><div class="card" id="l-cuentas"></div>
            <h2>Envelopes</h2><div class="card" id="l-sobres"></div>
            <h2>Goals</h2><div class="card" id="l-metas"></div>
            <div class="pull" id="h-sync"></div>
        </section>

        <!-- Actividad -->
        <section class="view" id="v-act">
            <h2 style="margin-top:8px">Recent activity</h2><div class="card" id="l-hist"></div>
        </section>

        <!-- Pagos -->
        <section class="view" id="v-bills">
            <h2 style="margin-top:8px">Bills and debts</h2><div class="card" id="l-comp"></div>
            <h2>Check Pay</h2><div class="card" id="l-check"></div>
        </section>

        <!-- Gemini -->
        <section class="view" id="v-chat">
            <h2 style="margin-top:8px">Ask KODA</h2>
            <div class="msgs" id="msgs"></div>
        </section>
    </main>

    <div class="chatbar"><div class="wrap">
        <label class="field" style="flex:1;margin:0"><span>Message</span><textarea id="chat-in" rows="1" class="inp" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea></label>
        <button class="send" id="chat-send" onclick="enviar()" aria-label="Send"><span class="ms">arrow_upward</span></button>
    </div></div>

    <nav class="tabs"><div class="in">
        <button class="tab on" data-v="home" onclick="ir('home')"><span class="ms">home</span>Home</button>
        <button class="tab" data-v="act" onclick="ir('act')"><span class="ms">receipt_long</span>Activity</button>
        <button class="fab" onclick="abrirHoja()" aria-label="Add"><span class="ms">add</span></button>
        <button class="tab" data-v="bills" onclick="ir('bills')"><span class="ms">event_note</span>Bills</button>
        <button class="tab" data-v="chat" onclick="ir('chat')"><span class="ms">auto_awesome</span>Ask</button>
    </div></nav>

    <div class="sheet-bg" onclick="cerrarHoja()"></div>
    <div class="sheet" role="dialog" aria-label="Add entry">
        <div class="grab"></div>
        <div class="seg"><button class="on" id="s-gasto" onclick="setTipo('Gasto')">Expense</button><button id="s-ingreso" onclick="setTipo('Ingreso')">Income</button></div>
        <label class="field"><span>Amount</span><input id="f-monto" class="inp" type="number" inputmode="decimal" step="0.01" min="0" style="font-size:26px;font-weight:800"></label>
        <label class="field"><span>Description</span><input id="f-desc" class="inp" type="text" maxlength="120" autocomplete="off"></label>
        <label class="field"><span>Account</span><select id="f-cuenta" class="inp"></select></label>
        <label class="field"><span>Category</span><select id="f-cat" class="inp"></select></label>
        <label class="field" id="w-sobre"><span>Envelope</span><select id="f-sobre" class="inp"></select></label>
        <div class="err" id="f-err"></div>
        <button class="btn" id="f-ok" onclick="guardar()">Save</button>
    </div>
    <div id="toast"></div>

<script>
const KEY = 'koda_nube';
let cfg = null, D = {}, tipo = 'Gasto', vista = 'home', cargando = false, chat = [], pensando = false;

try { cfg = JSON.parse(localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || 'null'); } catch (e) {}
if (!cfg || !cfg.url || !cfg.token) location.replace('login.html?m=1');

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => { n = Number(n) || 0; const v = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: Math.abs(n) % 1 ? 2 : 0, maximumFractionDigits: 2 }); return (n < 0 ? '-$' : '$') + v; };

async function api(action, extra = {}) {
    const falla = (m, o) => Object.assign(new Error(m), o);   // red: sin conexión o servidor caído (se puede reintentar)
    let r;
    try { r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: cfg.token, action, ...extra }) }); }
    catch (e) { throw falla('No connection', { red: true }); }
    if (!r.ok) throw falla('Server answered ' + r.status, { red: true });
    let d; try { d = await r.json(); } catch (e) { throw falla('Invalid server response', { red: true }); }
    if (!d.ok) { if (/clave|key/i.test(d.error || '')) { salir(); throw falla(d.error, { auth: true }); } throw new Error(d.error || 'Unknown error'); }
    return d;
}

function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); }

function salir() { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {} location.replace('login.html?m=1'); }

function ir(v) {
    vista = v;
    document.querySelectorAll('.view').forEach(e => e.classList.toggle('on', e.id === 'v-' + v));
    document.querySelectorAll('.tab').forEach(e => e.classList.toggle('on', e.dataset.v === v));
    document.body.classList.toggle('chat-on', v === 'chat');
    if (v === 'chat') pintarChat();
    scrollTo(0, 0);
}

function kodaLiquidez(cuentas, sobres, pendientes, compromisos) {
    const si = v => v === true || v === 'TRUE' || v === 'true';
    const marcadas = cuentas.filter(c => si(c.liquida));
    const base = marcadas.reduce((a, c) => a + (Number(c.saldo) || 0), 0);
    const enSobres = sobres.reduce((a, s) => a + Math.max(0, Number(s.monto) || 0), 0);
    const porPagar = pendientes.filter(i => !si(i.pagado)).filter(i => {
        if (i.tipoOrigen === 'fijo' || i.tipoOrigen === 'deuda') {
            const c = compromisos.find(x => x.id == i.refId && x.tipo === i.tipoOrigen);
            if (c && (c.afectaDisponible === false || c.afectaDisponible === 'FALSE' || c.afectaDisponible === 'false')) return false;
        }
        return true;
    }).reduce((a, i) => a + (Number(i.monto) || 0), 0);
    return { hayMarcadas: marcadas.length > 0, nombres: marcadas.map(c => c.apodo), base, enSobres, porPagar, libre: base - enSobres - porPagar };
}
function cacheD() { try { localStorage.setItem('koda_movil_cache', JSON.stringify({ t: Date.now(), D })); } catch (e) {} }

/* ---- Cola de pendientes: lo anotado sin señal se guarda en el teléfono y se envía solo ---- */
const COLA_KEY = 'koda_movil_cola';
let cola = []; try { cola = JSON.parse(localStorage.getItem(COLA_KEY) || '[]'); } catch (e) {}
let enviando = false;
const guardarCola = () => { try { localStorage.setItem(COLA_KEY, JSON.stringify(cola)); } catch (e) {} };
const nuevoCid = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function fechaLocal() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }

// Datos tal como se ven: lo guardado en la hoja + lo que aún espera para enviarse
function conPendientes() {
    const cu = JSON.parse(JSON.stringify(D.cuentas || [])), so = JSON.parse(JSON.stringify(D.sobres || [])), hi = (D.historial || []).slice();
    const ya = new Set(hi.map(m => m.refCliente).filter(Boolean));   // si la hoja ya lo tiene, no se cuenta dos veces
    const pend = cola.filter(i => !ya.has(i.cid));
    pend.filter(i => !i.fallo).forEach(i => {
        const c = cu.find(x => String(x.id) === String(i.cuentaId)); if (c) c.saldo = (Number(c.saldo) || 0) + (i.tipo === 'Ingreso' ? i.monto : -i.monto);
        if (i.tipo === 'Gasto' && i.sobre) { const s = so.find(x => x.nombre === i.sobre); if (s) s.monto = (Number(s.monto) || 0) - i.monto; }
    });
    pend.forEach(i => {
        const c = cu.find(x => String(x.id) === String(i.cuentaId));
        hi.push({ id: i.cid, tipo: i.tipo, monto: i.monto, desc: i.desc, categoria: i.sobre || i.categoria, cuentaOrigen: c ? c.apodo : '', fechaStr: i.fechaStr, pendiente: true, fallo: i.fallo, cid: i.cid });
    });
    return { cu, so, hi, n: pend.filter(i => !i.fallo).length, nFallo: pend.filter(i => i.fallo).length };
}

function aplicarEnD(it, mov) {
    const c = (D.cuentas || []).find(x => String(x.id) === String(it.cuentaId)); if (c) c.saldo = (Number(c.saldo) || 0) + (it.tipo === 'Ingreso' ? it.monto : -it.monto);
    if (it.tipo === 'Gasto' && it.sobre) { const s = (D.sobres || []).find(x => x.nombre === it.sobre); if (s) s.monto = (Number(s.monto) || 0) - it.monto; }
    (D.historial = D.historial || []).push(mov || { id: Date.now(), tipo: it.tipo, monto: it.monto, desc: it.desc, categoria: it.sobre || it.categoria, cuentaOrigen: c ? c.apodo : '', cuentaId: it.cuentaId, fechaStr: it.fechaStr, refCliente: it.cid });
    cacheD();
}

async function enviarCola(manual) {
    if (enviando) return;
    if (!cola.some(i => !i.fallo)) { if (manual) toast('Nothing to send'); return; }
    enviando = true; let alguno = false, sinRed = false;
    try {
        for (const it of cola.filter(i => !i.fallo)) {
            try {
                const r = await api('movimientoRapido', { cid: it.cid, tipo: it.tipo, monto: it.monto, desc: it.desc, cuentaId: it.cuentaId, categoria: it.categoria, sobre: it.sobre, fechaStr: it.fechaStr });
                cola = cola.filter(x => x.cid !== it.cid); guardarCola(); alguno = true;
                if (!r.duplicado) aplicarEnD(it, r.mov);
            } catch (e) {
                if (e.red) { sinRed = true; break; }   // sin conexión: se reintenta más tarde, en el mismo orden
                if (e.auth) break;
                it.fallo = e.message; guardarCola();    // el servidor la rechazó (por ejemplo, una cuenta que ya no existe)
            }
        }
    } finally { enviando = false; pintar(); }
    if (manual) toast(sinRed ? 'Still no connection' : 'Sent');
    if (alguno) cargar(false);
}

function descartar(cid) {
    if (!confirm('Remove this entry? It could not be sent.')) return;
    cola = cola.filter(x => x.cid !== cid); guardarCola(); pintar();
}

async function cargar(manual) {
    if (cargando) return; cargando = true;
    const ic = $('ic-ref'); ic.style.transition = 'transform .8s'; ic.style.transform = 'rotate(360deg)';
    try {
        const r = await api('cargar');
        D = r.datos || {};
        cacheD();
        pintar();
        enviarCola();
        $('h-sync').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (manual) toast('Up to date');
    } catch (e) {
        $('h-sync').textContent = 'Offline. Showing the last saved data.';
        if (manual) toast(e.message);
    } finally { setTimeout(() => { ic.style.transition = 'none'; ic.style.transform = ''; }, 850); cargando = false; }
}

const esTarjeta = c => c.tipo === 'Tarjeta Crédito';
function pintar() {
    const P = conPendientes();
    const cu = P.cu, hi = P.hi, so = P.so, me = D.metas || [], co = D.compromisos || [], ck = D.checkpay || [];
    $('h-cola').classList.toggle('on', P.n + P.nFallo > 0);
    $('h-cola-txt').innerHTML = P.n ? `<b>${P.n}</b> waiting to send. They go out when you have a connection.` + (P.nFallo ? ` ${P.nFallo} could not be sent (see Activity).` : '') : `<b>${P.nFallo}</b> could not be sent (see Activity).`;
    // Available balance = liquidez, igual que la web (cuentas marcadas - sobres - lo que falta por pagar)
    const L = kodaLiquidez(cu, so, ck, co);
    $('h-total').textContent = money(L.hayMarcadas ? L.libre : cu.reduce((a, c) => a + (Number(c.saldo) || 0), 0));
    $('h-detalle').textContent = L.hayMarcadas ? `${money(L.base)} in ${L.nombres.join(', ')}` + (L.enSobres ? ` · ${money(L.enSobres)} in envelopes` : '') + (L.porPagar ? ` · ${money(L.porPagar)} to pay` : '') : (cu.length ? 'Choose your spending account in KODA on your computer.' : '');
    const mes = new Date().toISOString().slice(0, 7);
    const delMes = hi.filter(m => String(m.fechaStr || '').slice(0, 7) === mes);
    $('h-gasto').textContent = money(delMes.filter(m => m.tipo === 'Gasto').reduce((a, m) => a + (Number(m.monto) || 0), 0));
    $('h-ingreso').textContent = money(delMes.filter(m => m.tipo === 'Ingreso').reduce((a, m) => a + (Number(m.monto) || 0), 0));

    $('l-cuentas').innerHTML = cu.length ? cu.map(c => {
        const s = Number(c.saldo) || 0;
        const sub = esTarjeta(c) ? (c.limite ? 'Available ' + money(Number(c.limite) + s) : 'Credit card') : (c.banco || c.tipo || 'Account');
        return `<div class="item"><div class="dot"><span class="ms">${esTarjeta(c) ? 'credit_card' : 'account_balance'}</span></div><div class="main"><div class="t">${esc(c.apodo)}</div><div class="s">${esc(sub)}</div></div><div class="amt ${s < 0 ? 'neg' : ''}">${money(s)}</div></div>`;
    }).join('') : '<div class="empty">No accounts yet. Add them from KODA on your computer.</div>';

    $('l-sobres').innerHTML = so.length ? so.map(s => {
        const m = Number(s.monto) || 0, g = Number(s.meta) || 0, p = g ? Math.max(0, Math.min(100, m / g * 100)) : 0;
        return `<div class="item"><div class="main"><div style="display:flex;justify-content:space-between;gap:8px"><div class="t">${esc(s.nombre)}</div><div class="amt">${money(m)}</div></div>${g ? `<div class="bar"><div style="width:${p}%"></div></div>` : ''}</div></div>`;
    }).join('') : '<div class="empty">No envelopes yet.</div>';

    $('l-metas').innerHTML = me.length ? me.map(m => {
        const a = Number(m.montoActual) || 0, t = Number(m.metaTotal) || 0, p = t ? Math.min(100, a / t * 100) : 0;
        return `<div class="item"><div class="main"><div style="display:flex;justify-content:space-between;gap:8px"><div class="t">${esc(m.nombre)}</div><div class="s" style="margin:0">${money(a)} of ${money(t)}</div></div><div class="bar"><div style="width:${p}%"></div></div></div></div>`;
    }).join('') : '<div class="empty">No goals yet.</div>';

    const ult = hi.slice().sort((a, b) => String(b.fechaStr || '').localeCompare(String(a.fechaStr || ''))).slice(0, 60);
    $('l-hist').innerHTML = ult.length ? ult.map(m => {
        const ing = m.tipo === 'Ingreso', fe = String(m.fechaStr || '');
        const f = fe ? new Date(fe).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
        const marca = m.pendiente ? (m.fallo ? ` · <span class="tag">Not sent: ${esc(m.fallo)}</span>` : ' · <span class="tag">Pending</span>') : '';
        const clic = m.pendiente && m.fallo ? ` onclick="descartar('${esc(m.cid)}')"` : '';
        return `<div class="item"${clic}><div class="dot"><span class="ms">${m.pendiente ? 'schedule' : ing ? 'south_west' : m.tipo === 'Transferencia' ? 'swap_horiz' : 'north_east'}</span></div><div class="main"><div class="t">${esc(m.desc || m.tipo)}</div><div class="s">${esc(f)} · ${esc(m.cuentaOrigen || '')}${m.categoria ? ' · ' + esc(m.categoria) : ''}${marca}</div></div><div class="amt ${ing ? 'pos' : ''}">${ing ? '+' : ''}${money(m.monto)}</div></div>`;
    }).join('') : '<div class="empty">No activity yet.</div>';

    $('l-comp').innerHTML = co.length ? co.map(c => {
        const mens = (Number(c.montoQ1) || 0) + (Number(c.montoQ2) || 0), deuda = c.tipo === 'deuda';
        return `<div class="item"><div class="dot"><span class="ms">${deuda ? 'real_estate_agent' : 'event_repeat'}</span></div><div class="main"><div class="t">${esc(c.nombre)}</div><div class="s">${deuda ? 'Remaining ' + money(c.deudaActual) : 'Fixed bill'}</div></div><div class="amt">${money(mens)}<span class="s"> /mo</span></div></div>`;
    }).join('') : '<div class="empty">No bills or debts yet.</div>';

    $('l-check').innerHTML = ck.length ? ck.map(c => {
        const ok = c.pagado === true || c.pagado === 'TRUE' || c.pagado === 'true';
        return `<div class="item"><div class="dot"><span class="ms">${ok ? 'check_circle' : 'radio_button_unchecked'}</span></div><div class="main"><div class="t" style="${ok ? 'opacity:.55;text-decoration:line-through' : ''}">${esc(c.nombre)}</div></div><div class="amt">${money(c.monto)}</div></div>`;
    }).join('') : '<div class="empty">Nothing to pay right now.</div>';
}

/* ---- Registrar ---- */
function setTipo(t) {
    tipo = t; $('s-gasto').classList.toggle('on', t === 'Gasto'); $('s-ingreso').classList.toggle('on', t === 'Ingreso');
    $('w-sobre').style.display = t === 'Gasto' && (D.sobres || []).length ? '' : 'none';
}
function abrirHoja() {
    const cu = (D.cuentas || []);
    if (!cu.length) { toast('Add an account first from KODA on your computer'); return; }
    $('f-cuenta').innerHTML = cu.map(c => `<option value="${esc(c.id)}">${esc(c.apodo)}</option>`).join('');
    const cats = (D.categorias || []).map(c => c.nombre).filter(Boolean);
    $('f-cat').innerHTML = (cats.length ? cats : ['General']).map(c => `<option>${esc(c)}</option>`).join('');
    $('f-sobre').innerHTML = '<option value="">None</option>' + (D.sobres || []).map(s => `<option>${esc(s.nombre)}</option>`).join('');
    $('f-monto').value = ''; $('f-desc').value = ''; $('f-err').textContent = ''; setTipo('Gasto');
    document.body.classList.add('sheet-on'); setTimeout(() => $('f-monto').focus(), 280);
}
function cerrarHoja() { document.body.classList.remove('sheet-on'); document.activeElement && document.activeElement.blur(); }
async function guardar() {
    const monto = parseFloat($('f-monto').value);
    if (!(monto > 0)) { $('f-err').textContent = 'Enter an amount greater than zero.'; return; }
    // Se guarda primero en el teléfono (así nunca se pierde) y luego se envía a la hoja
    const it = { cid: nuevoCid(), tipo, monto, desc: $('f-desc').value.trim(), cuentaId: $('f-cuenta').value, categoria: $('f-cat').value, sobre: tipo === 'Gasto' ? $('f-sobre').value : '', fechaStr: fechaLocal() };
    cola.push(it); guardarCola(); cerrarHoja(); pintar();
    await enviarCola();
    const q = cola.find(x => x.cid === it.cid);
    toast(!q ? (tipo === 'Gasto' ? 'Expense saved' : 'Income saved') : q.fallo ? 'Not sent: ' + q.fallo : 'Saved on this phone. It will be sent when you have a connection.');
}

/* ---- Chat ---- */
function fmtChat(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^\s*[-*] /gm, '• '); }
function pintarChat() {
    const box = $('msgs');
    if (!chat.length) {
        box.innerHTML = ['How much did I spend this month?', 'Which category costs me the most?', 'What bills are coming up?'].map(s => `<button class="sug" onclick="enviar(this.textContent)">${esc(s)}</button>`).join('');
    } else {
        box.innerHTML = chat.map(m => `<div class="b ${m.rol === 'user' ? 'u' : 'm'}${m.error ? ' e' : ''}">${m.rol === 'user' ? esc(m.texto) : fmtChat(m.texto)}</div>`).join('') + (pensando ? '<div class="b m"><span class="dots"><span></span><span></span><span></span></span></div>' : '');
    }
    setTimeout(() => scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 30);
}
async function enviar(directo) {
    const inp = $('chat-in'), texto = (typeof directo === 'string' ? directo : inp.value).trim();
    if (!texto || pensando) return;
    const hist = chat.filter(m => !m.error).slice(-10).map(m => ({ rol: m.rol, texto: m.texto }));
    chat.push({ rol: 'user', texto }); inp.value = ''; inp.style.height = 'auto'; pensando = true; pintarChat();
    try {
        const r = await api('preguntar', { mensaje: texto, historial: hist });
        chat.push({ rol: 'model', texto: r.respuesta || '' });
    } catch (e) {
        chat.push({ rol: 'model', texto: e.red ? 'Could not reach the server. Check your connection.' : e.message, error: true });
    } finally { pensando = false; pintarChat(); }
}
$('chat-in').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });

/* ---- Inicio ---- */
try { const c = JSON.parse(localStorage.getItem('koda_movil_cache') || 'null'); if (c && c.D) { D = c.D; pintar(); $('h-sync').textContent = 'Showing saved data...'; } } catch (e) {}
if (cfg) cargar(false);
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg) { enviarCola(); cargar(false); } });
window.addEventListener('online', () => enviarCola());
setInterval(() => { if (cfg && cola.some(i => !i.fallo)) enviarCola(); }, 15000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
