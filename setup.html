<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KODA - Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='sans-serif' font-weight='900' fill='%2366A5AD'>K.</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <script>window.KODA_SIN_NUBE = true;</script>
</head>
<body class="font-sans min-h-screen flex flex-col items-center p-4 md:p-6 bg-koda-darkBg text-white relative">

    <main class="w-full max-w-[520px] mt-10 flex flex-col gap-6">
        <div class="flex items-center justify-between">
            <h1 class="text-3xl font-semibold tracking-tight">Setup</h1>
            <button type="button" onclick="navegarA('dashboard')" class="px-5 py-2.5 text-xs font-semibold text-koda-steel hover:text-white rounded-full hover:bg-white/5 transition-colors cursor-pointer outline-none">Back to dashboard</button>
        </div>

        <div class="bg-koda-darkCard border border-koda-darkBorder rounded-[1.5rem] p-6 flex flex-col gap-4">
            <h2 class="text-lg font-semibold tracking-tight">Google Sheets connection</h2>

            <div class="bg-[#0A0D12] border border-white/5 rounded-xl px-4 py-3 flex flex-col gap-1">
                <span class="text-[11.5px] font-semibold text-koda-steel">Web app address</span>
                <input type="text" id="st-url" autocomplete="off" spellcheck="false" class="w-full bg-transparent text-sm text-white font-medium border-none outline-none select-text">
            </div>

            <div class="bg-[#0A0D12] border border-white/5 rounded-xl px-4 py-3 flex flex-col gap-1">
                <span class="text-[11.5px] font-semibold text-koda-steel">Access key</span>
                <input type="password" id="st-token" autocomplete="off" spellcheck="false" class="w-full bg-transparent text-sm text-white font-medium border-none outline-none select-text">
            </div>

            <div id="st-estado" class="text-[12px] font-semibold text-koda-steel min-h-[18px]"></div>

            <div class="flex flex-wrap gap-2 justify-end">
                <button type="button" id="st-desconectar" onclick="stDesconectar()" class="hidden px-5 py-2.5 text-xs font-semibold text-koda-steel hover:text-white rounded-full hover:bg-white/5 transition-colors cursor-pointer outline-none mr-auto">Disconnect</button>
                <button type="button" id="st-probar" onclick="stGuardarYProbar()" class="px-6 py-2.5 text-xs font-semibold bg-koda-blue text-[#131722] hover:bg-[#7ab5bd] rounded-full transition-colors cursor-pointer outline-none">Save and test</button>
            </div>
        </div>

        <div id="st-datos" class="hidden bg-koda-darkCard border border-koda-darkBorder rounded-[1.5rem] p-6 flex flex-col gap-4">
            <h2 class="text-lg font-semibold tracking-tight">Starting data</h2>
            <div id="st-resumen" class="text-sm text-koda-steel font-medium"></div>
            <div class="flex justify-end">
                <button type="button" id="st-subir" onclick="stSubirDatos()" class="px-6 py-2.5 text-xs font-semibold bg-koda-blue text-[#131722] hover:bg-[#7ab5bd] rounded-full transition-colors cursor-pointer outline-none">Upload sample data</button>
            </div>
        </div>
    </main>

    <div id="contenedor-modal"></div>

    <script src="koda-api.js"></script>
    <script src="app.js"></script>
    <script>
        const stEl = id => document.getElementById(id);
        function stEstado(msg, error) {
            stEl('st-estado').innerText = msg || '';
            stEl('st-estado').className = 'text-[12px] font-semibold min-h-[18px] ' + (error ? 'text-koda-red' : 'text-koda-blue');
        }
        function stLeer() { return { url: stEl('st-url').value.trim(), token: stEl('st-token').value.trim() }; }

        async function stGuardarYProbar() {
            const cfg = stLeer();
            if (!cfg.url || !cfg.token) return mostrarAlertaKoda('Missing information', 'Enter the web app address and the access key.');
            if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(cfg.url)) return mostrarAlertaKoda('Check the address', 'It should start with https://script.google.com/macros/s/ and end with /exec.');
            const btn = stEl('st-probar');
            kodaBotonCargando(btn, true);
            stEstado('');
            try {
                await kodaNubeLlamar('ping', {}, cfg);
                localStorage.setItem(KODA_NUBE_KEY, JSON.stringify(cfg));
                stEstado('Connected');
                stEl('st-desconectar').classList.remove('hidden');
                await stRevisarHoja(cfg);
            } catch (e) {
                stEstado(e.message, true);
            } finally {
                kodaBotonCargando(btn, false);
            }
        }

        async function stRevisarHoja(cfg) {
            const { datos } = await kodaNubeLlamar('cargar', {}, cfg);
            const total = Object.values(datos).reduce((a, f) => a + f.length, 0);
            stEl('st-datos').classList.remove('hidden');
            stEl('st-resumen').innerText = total
                ? `Your sheet already has ${total} records. Uploading will replace them with the sample data.`
                : 'Your sheet is empty. Upload the sample data to start.';
        }

        function stSubirDatos() {
            kodaConfirmar('Upload sample data', 'This replaces what is in your Google Sheet.', async () => {
                const btn = stEl('st-subir');
                kodaBotonCargando(btn, true);
                try {
                    const datos = {};
                    Object.keys(KODA_TABLAS_NUBE).forEach(t => { datos[t] = kodaNubeSerializar(t); });
                    await kodaNubeLlamar('sembrar', { datos });
                    stEstado('Data uploaded');
                    await stRevisarHoja(stLeer());
                } catch (e) {
                    stEstado(e.message, true);
                } finally {
                    kodaBotonCargando(btn, false);
                }
            }, 'Upload');
        }

        function stDesconectar() {
            localStorage.removeItem(KODA_NUBE_KEY);
            stEl('st-url').value = ''; stEl('st-token').value = '';
            stEl('st-desconectar').classList.add('hidden');
            stEl('st-datos').classList.add('hidden');
            stEstado('Disconnected. KODA is back to sample data.');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const c = kodaNubeConfig();
            if (c) { stEl('st-url').value = c.url; stEl('st-token').value = c.token; stEl('st-desconectar').classList.remove('hidden'); stEstado('Saved on this device'); }
        });
    </script>
</body>
</html>
