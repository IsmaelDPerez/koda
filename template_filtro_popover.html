<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KODA - Template Filtro Popover</title>
    
    <!-- Fuentes e Iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['"Maven Pro"', 'sans-serif'] }, 
                    colors: { 
                        koda: { 
                            darkBg: '#131722', 
                            darkCard: '#1E222D', 
                            darkBorder: '#2A2E39', 
                            textMuted: '#B2B5BE', 
                            white: '#F8F9FA', 
                            blue: '#66A5AD', 
                            gold: '#C1A35F', 
                            steel: '#787886' 
                        } 
                    } 
                } 
            } 
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none !important; }
        * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
    </style>
</head>
<body class="bg-koda-darkBg font-sans flex flex-col items-center justify-center min-h-screen p-6 text-white relative">

    <!-- Barra de demostración -->
    <div class="flex items-center justify-between gap-4 bg-koda-darkCard border border-koda-darkBorder p-5 rounded-2xl w-full max-w-sm">
        <div>
            <h4 class="text-sm font-bold text-white leading-tight">Sobres Activos</h4>
            <span class="text-[11.5px] font-bold text-koda-steel leading-tight">Vista previa</span>
        </div>

        <!-- ==========================================
             DISPARADOR IDÉNTICO A TEMPLATE_DATAGRID
             ========================================== -->
        <div class="relative">
            <button type="button" id="btn-trigger-filtro" onclick="togglePopoverFiltro(event)" class="flex items-center gap-2 h-9 px-4 rounded-full border border-white/10 hover:border-white/20 text-[11.5px] font-bold text-white transition-colors cursor-pointer outline-none bg-transparent">
                <span class="material-symbols-outlined text-[16px] text-koda-steel">filter_list</span>
                <span id="label-filtro-activo">Filtros</span>
            </button>

            <!-- ==========================================
                 POPOVER FLOTANTE KODA DARK ZEN
                 ========================================== -->
            <div id="popover-filtro-koda" class="hidden absolute right-0 top-full mt-3 w-[220px] bg-[#141820] border border-white/10 rounded-2xl shadow-2xl z-30 p-4 flex flex-col gap-3 backdrop-blur-md" onclick="event.stopPropagation()">
                
                <div class="flex items-center justify-between pb-1 border-b border-white/5">
                    <span class="text-[10px] font-bold text-koda-steel uppercase tracking-widest">Ordenar por</span>
                    <button type="button" onclick="cerrarPopoverFiltro()" class="text-koda-steel hover:text-white transition-colors cursor-pointer outline-none">
                        <span class="material-symbols-outlined text-[14px]">close</span>
                    </button>
                </div>

                <div class="flex flex-col gap-1" id="lista-criterios">
                    <button type="button" onclick="seleccionarCriterio(this, 'Mayor saldo')" class="item-filtro w-full px-3 py-2 rounded-xl text-left text-[11.5px] font-bold text-koda-gold bg-koda-gold/10 flex items-center justify-between transition-colors cursor-pointer outline-none">
                        <span>Mayor saldo</span>
                        <span class="material-symbols-outlined text-[16px]">check</span>
                    </button>

                    <button type="button" onclick="seleccionarCriterio(this, 'Menor saldo')" class="item-filtro w-full px-3 py-2 rounded-xl text-left text-[11.5px] font-bold text-koda-steel hover:text-white hover:bg-white/5 flex items-center justify-between transition-colors cursor-pointer outline-none">
                        <span>Menor saldo</span>
                        <span class="material-symbols-outlined text-[16px] opacity-0">check</span>
                    </button>

                    <button type="button" onclick="seleccionarCriterio(this, '% Llenado')" class="item-filtro w-full px-3 py-2 rounded-xl text-left text-[11.5px] font-bold text-koda-steel hover:text-white hover:bg-white/5 flex items-center justify-between transition-colors cursor-pointer outline-none">
                        <span>% Llenado</span>
                        <span class="material-symbols-outlined text-[16px] opacity-0">check</span>
                    </button>

                    <button type="button" onclick="seleccionarCriterio(this, 'Nombre A-Z')" class="item-filtro w-full px-3 py-2 rounded-xl text-left text-[11.5px] font-bold text-koda-steel hover:text-white hover:bg-white/5 flex items-center justify-between transition-colors cursor-pointer outline-none">
                        <span>Nombre A-Z</span>
                        <span class="material-symbols-outlined text-[16px] opacity-0">check</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de control -->
    <script>
        const popover = document.getElementById('popover-filtro-koda');
        const trigger = document.getElementById('btn-trigger-filtro');

        function togglePopoverFiltro(e) {
            e.stopPropagation();
            popover.classList.toggle('hidden');
        }

        function cerrarPopoverFiltro() {
            if (popover) popover.classList.add('hidden');
        }

        function seleccionarCriterio(btn, texto) {
            document.querySelectorAll('.item-filtro').forEach(i => {
                i.className = 'item-filtro w-full px-3 py-2 rounded-xl text-left text-[11.5px] font-bold text-koda-steel hover:text-white hover:bg-white/5 flex items-center justify-between transition-colors cursor-pointer outline-none';
                const icon = i.querySelector('.material-symbols-outlined');
                if (icon) icon.classList.add('opacity-0');
            });

            btn.className = 'item-filtro w-full px-3 py-2 rounded-xl text-left text-[11.5px] font-bold text-koda-gold bg-koda-gold/10 flex items-center justify-between transition-colors cursor-pointer outline-none';
            const iconActivo = btn.querySelector('.material-symbols-outlined');
            if (iconActivo) iconActivo.classList.remove('opacity-0');

            document.getElementById('label-filtro-activo').innerText = texto;
            cerrarPopoverFiltro();
        }

        document.addEventListener('click', (e) => {
            if (popover && !popover.classList.contains('hidden')) {
                if (!popover.contains(e.target) && !trigger.contains(e.target)) {
                    cerrarPopoverFiltro();
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') cerrarPopoverFiltro();
        });
    </script>
</body>
</html>
